<div class="login-wrapper">
  <mat-card class="login-card">
    <mat-card-header>
      <mat-card-title>🏺 Artisan Admin</mat-card-title>
      <mat-card-subtitle>Espace d'administration</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="onLogin()">

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Email</mat-label>
          <input matInput formControlName="email" type="email" autocomplete="email">
          <mat-icon matSuffix>email</mat-icon>
          @if (form.get('email')?.hasError('email')) {
            <mat-error>Email invalide</mat-error>
          }
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Mot de passe</mat-label>
          <input matInput formControlName="password"
                 [type]="hidePassword ? 'password' : 'text'"
                 autocomplete="current-password">
          <button mat-icon-button matSuffix type="button"
                  (click)="hidePassword = !hidePassword">
            <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
        </mat-form-field>

        <button mat-raised-button color="primary" type="submit"
                class="full-width" [disabled]="form.invalid || loading">
          @if (loading) {
            <mat-spinner diameter="20" style="display:inline-block"></mat-spinner>
          } @else {
            Se connecter
          }
        </button>

      </form>
    </mat-card-content>
  </mat-card>
</div>
