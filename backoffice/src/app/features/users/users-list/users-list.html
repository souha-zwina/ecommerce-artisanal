<!-- src/app/features/users/users-list/users-list.html -->
<div class="page-header">
  <h1 class="page-title">Utilisateurs</h1>
  <mat-form-field appearance="outline" subscriptSizing="dynamic">
    <mat-label>Rechercher</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput (input)="onSearch($event)">
  </mat-form-field>
</div>

<mat-card>
  <mat-table [dataSource]="filtered">
    <ng-container matColumnDef="nom">
      <mat-header-cell *matHeaderCellDef>Nom</mat-header-cell>
      <mat-cell *matCellDef="let u"><strong>{{ u.nom }}</strong></mat-cell>
    </ng-container>

    <ng-container matColumnDef="email">
      <mat-header-cell *matHeaderCellDef>Email</mat-header-cell>
      <mat-cell *matCellDef="let u">{{ u.email }}</mat-cell>
    </ng-container>

    <ng-container matColumnDef="role">
      <mat-header-cell *matHeaderCellDef>Rôle</mat-header-cell>
      <mat-cell *matCellDef="let u">
        <span [class]="u.role === 'ADMIN' ? 'badge badge-confirmed' : 'badge badge-delivered'">
          {{ u.role }}
        </span>
      </mat-cell>
    </ng-container>

    <ng-container matColumnDef="actions">
      <mat-header-cell *matHeaderCellDef>Actions</mat-header-cell>
      <mat-cell *matCellDef="let u">
        <button mat-icon-button color="primary"
                (click)="toggleRole(u)"
                [title]="u.role === 'ADMIN' ? 'Rétrograder en Client' : 'Promouvoir Admin'">
          <mat-icon>{{ u.role === 'ADMIN' ? 'arrow_downward' : 'arrow_upward' }}</mat-icon>
        </button>
      </mat-cell>
    </ng-container>

    <mat-header-row *matHeaderRowDef="columns"></mat-header-row>
    <mat-row *matRowDef="let row; columns: columns;"></mat-row>

    <tr class="mat-row" *matNoDataRow>
      <td class="mat-cell" [attr.colspan]="columns.length" style="text-align:center;padding:24px;color:#888">
        Aucun utilisateur trouvé
      </td>
    </tr>
  </mat-table>
</mat-card>
